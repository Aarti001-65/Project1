{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-warning">
            <h4 class="mb-0">
                ✏️ Edit Exam
            </h4>
        </div>

        <div class="card-body">

            <form method="POST">

                <!-- Exam Name -->
                <div class="mb-3">
                    <label class="form-label">
                        Exam Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ exam['name'] }}"
                        required>
                </div>


                <!-- Subject -->
                <div class="mb-3">
                    <label class="form-label">
                        Subject
                    </label>

                    <select
                        name="subject_id"
                        class="form-select"
                        required>

                        {% for subject in subjects %}

                        <option
                            value="{{ subject['id'] }}"
                            {% if subject['id'] == exam['subject_id'] %}
                            selected
                            {% endif %}>

                            {{ subject['name'] }}

                        </option>

                        {% endfor %}

                    </select>
                </div>


                <!-- Duration -->
                <div class="mb-3">
                    <label class="form-label">
                        Duration (minutes)
                    </label>

                    <input
                        type="number"
                        name="duration"
                        class="form-control"
                        value="{{ exam['duration'] }}"
                        min="1"
                        required>
                </div>


                <!-- Exam Date -->
                <div class="mb-3">
                    <label class="form-label">
                        Exam Date
                    </label>

                    <input
                        type="date"
                        name="exam_date"
                        class="form-control"
                        value="{{ exam['exam_date'] }}"
                        required>
                </div>


                <!-- Status -->
                <div class="mb-3">
                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="status"
                        class="form-select"
                        required>

                        <option
                            value="active"
                            {% if exam['status'] == 'active' %}
                            selected
                            {% endif %}>
                            Active
                        </option>

                        <option
                            value="inactive"
                            {% if exam['status'] == 'inactive' %}
                            selected
                            {% endif %}>
                            Inactive
                        </option>

                    </select>
                </div>


                <!-- Buttons -->
                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">
                        💾 Update Exam
                    </button>

                    <a
                        href="{{ url_for('available_exams') }}"
                        class="btn btn-secondary">
                        ← Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
