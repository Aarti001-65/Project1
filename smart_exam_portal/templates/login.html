{% extends "base.html" %}

{% block content %}

<h2>Student Login</h2>

<form method="POST">

    <div class="mb-3">
        <label>Enrollment Number</label>
        <input type="text"
               name="enrollment_no"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input type="password"
               name="password"
               class="form-control"
               required>
    </div>

    <button type="submit"
            class="btn btn-primary">
        Login
    </button>

</form>

{% endblock %}
