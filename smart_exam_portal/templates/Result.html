{% extends "base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-body text-center">

        <h2>
            Exam Result
        </h2>

        <h4>
            Score :
            {{ score }}/5
        </h4>

        <h4>
            Percentage :
            {{ percentage }}%
        </h4>

        {% if result == "Pass" %}

        <span class="badge bg-success">
            PASS
        </span>

        {% else %}

        <span class="badge bg-danger">
            FAIL
        </span>

        {% endif %}

    </div>

</div>

{% endblock %}
