{% extends "base.html" %}

{% block content %}

<h2>Add New Student</h2>

<form action="{{ url_for('add_students') }}" method="POST">

    

    <div class="mb-3">
        <label class="form-label">Student Name</label>
        <input type="text"
               name="student_name"
               class="form-control"
               required>
    </div>
    <div class="mb-3">
        <label class="form-label">subject_name</label>
        <input type="text"
               name="subject_name"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Marks</label>
        <input type="number"
               name="marks"
               class="form-control"
               required>
    </div>
    
    <button type="submit" class="btn btn-success">
        Add Student
    </button>

</form>

{% endblock %}
