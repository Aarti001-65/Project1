{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
    Online MCQ Exam
</h2>

<form method="POST"
      action="{{ url_for('submit_exam') }}">

{% for q in questions %}

{% set question_index = loop.index0 %}

<div class="card mb-3">
    <div class="card-body">

        <h5>
            Q{{ loop.index }}.
            {{ q.question }}
        </h5>

        {% for option in q.options %}

        <div class="form-check">

            <input
                class="form-check-input"
                type="radio"
                name="q{{ question_index }}"
                value="{{ option }}"
                required>

            <label class="form-check-label">
                {{ option }}
            </label>

        </div>

        {% endfor %}

    </div>
</div>

{% endfor %}

<button type="submit" class="btn btn-primary">
    Submit Exam
</button>

</form>

{% endblock %}
