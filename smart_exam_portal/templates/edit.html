{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>Edit Student</h3>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Roll Number</label>
                    <input type="number"
                           name="roll_number"
                           class="form-control"
                           value="{{ student.roll_number }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Student Name</label>
                    <input type="text"
                           name="student_name"
                           class="form-control"
                           value="{{ student.student_name }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Score</label>
                    <input type="number"
                           name="score"
                           class="form-control"
                           value="{{ student.score }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Percentage</label>
                    <input type="number"
                           step="0.01"
                           name="percentage"
                           class="form-control"
                           value="{{ student.percentage }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Exam Date</label>
                    <input type="date"
                           name="exam_date"
                           class="form-control"
                           value="{{ student.exam_date }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Subject</label>

                    <select name="subject_id" class="form-select">

                        {% for subject in subjects %}

                        <option value="{{ subject.id }}"
                        {% if subject.id == student.subject_id %}
                        selected
                        {% endif %}>

                            {{ subject.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">Current Photo</label>
                    <br>

                    <img src="{{ url_for('static', filename='uploads/' ~ (student.photo or 'default.jpg')) }}"
                         width="120"
                         height="120"
                         class="rounded-circle"
                         style="object-fit:cover;">

                </div>

                <div class="mb-3">

                    <label class="form-label">Change Photo</label>

                    <input type="file"
                           name="photo"
                           class="form-control">

                </div>

                <button class="btn btn-success">
                    Update Student
                </button>

                <a href="{{ url_for('records') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
