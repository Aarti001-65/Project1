<!DOCTYPE html>
<html>
<head>
    <title>Smart Exam Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">
            🎓 Smart Exam Portal
        </a>

        <div>
            <a class="nav-link text-white d-inline" href="{{ url_for('home') }}">Home</a>
            <a class="nav-link text-white d-inline" href="{{ url_for('records') }}">Records</a>
            <a class="nav-link text-white d-inline" href="{{ url_for('add_students') }}">Add Student</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}
    {% endblock %}

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2026 Smart Exam Portal
</footer>

</body>
</html>
