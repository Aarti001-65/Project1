{% extends "base.html" %}

{% block content %}

<h2>Student Records</h2>

<table border="1" cellpadding="8">

<tr>
    <th>Roll No</th>
    <th>Name</th>
    <th>Score</th>
    <th>Percentage</th>
    <th>Exam Date</th>
</tr>

{% for student in students %}
<tr>
    <td>{{ student.roll_no }}</td>
    <td>{{ student.name }}</td>
    <td>{{ student.score }}</td>
    <td>{{ student.percentage }}%</td>
    <td>{{ student.exam_date }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
